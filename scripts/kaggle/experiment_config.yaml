# UTTA-Med 2.0 Kaggle GPU Experiment Configuration
# Phase 8: Multi-Seed, Multi-Signal Adaptation and Bio-SafeAdapt

experiment_name: "utta_med_v2_multiseed_evaluation"
version: "2.0.0"

seeds:
  - 42
  - 123
  - 2024
  - 7
  - 99

datasets:
  camelyon17:
    train_centers: [0, 3, 4]
    val_center: 1
    test_center: 2
    batch_size: 32
    num_workers: 4
  midog2021:
    source_scanners: [1, 2]
    target_scanner: 3
    num_cases: 50
    patches_per_case: 22
    confidence_threshold: 0.20
    radius: 30

models:
  classification:
    architecture: "resnet18"
    num_classes: 1
    pretrained: false
  detection:
    architecture: "fasterrcnn_resnet50_fpn"
    num_classes: 2

adaptation:
  optimizer:
    name: "Adam"
    lr: 1e-4
    betas: [0.9, 0.999]
    weight_decay: 0.0
  bn_affine_only: true
  freeze_running_stats: true

policies:
  adaptive_uncertainty:
    tau_high: 0.90
    tau_low: 0.65
    tau_unc: 8.875383e-06
    max_mc_passes: 20
    min_mc_passes: 5
    chunk_size: 5
    variance_stability_tol: 1e-5
    use_consistency: true
  multi_signal:
    alpha: 0.50
    beta: 0.30
    gamma: 0.20
    tau_total: 0.05
    n_mc_passes: 10
  bio_safeadapt:
    min_cellularity_threshold: 0.05
    hematoxylin_od_threshold: 0.15
    max_consecutive_silence: 5
    anchor_lambda: 0.01

ablations:
  - "A0_frozen_source"
  - "A1_confidence_gating"
  - "A2_original_utta_med"
  - "A3_adaptive_mc_dropout"
  - "A4_consistency_uncertainty"
  - "A5_feature_shift_uncertainty"
  - "A6_combined_uncertainty_gating"
  - "A7_combined_with_consistency_loss"
  - "A8_combined_with_source_regularization"
  - "A9_complete_utta_med_2_0"
