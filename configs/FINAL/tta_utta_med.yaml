# CANONICAL UTTA-MED TEST-TIME ADAPTATION CONFIGURATION (FROZEN PROTOCOL)

tta:
  method: utta_med
  optimizer: adam
  learning_rate: 1.0e-5
  steps_per_batch: 1
  mc_passes: 20
  dropout_p: 0.5
  bn_adaptation: bn_affine_only
  bn_running_stats: frozen
  tau_rule: val_center1_70th_percentile

