# CANONICAL EVALUATION CONFIGURATION (FROZEN PROTOCOL)

evaluation:
  target_center: 2
  metrics:
    - auroc
    - f1
    - auprc
    - ece
    - brier
    - harmful_adaptation_rate
    - coverage
  bootstrap:
    method: wsi_resample
    n_slides: 10
    n_bootstraps: 1000
    ci_level: 0.95
  multiplicity_correction: holm_bonferroni
