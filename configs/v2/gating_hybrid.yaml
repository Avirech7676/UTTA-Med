# SafeAdapt v2 Stage D1: Policy D - Efficient Hybrid Gating
policy: "hybrid"
description: "Two-stage deterministic confidence screening with selective MC-dropout on ambiguous patches"

gating:
  theta_high: 0.95            # Confident threshold: auto-accept without MC
  theta_low: 0.65             # Noise threshold: auto-reject without MC
  tau_unc: 8.875383e-06       # Seed 42 frozen 70th percentile threshold for ambiguous subset
  n_passes: 20                # Passes executed ONLY on ambiguous patches
  seed: 42

controller:
  bn_affine_only: true
  freeze_running_stats: true
  tta_lr: 1.0e-5
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true
  max_grad_norm: 1.0
  param_displacement_bound_linf: 0.20
  monitor:
    mode: "observation"
    window_size: 50
    min_samples_for_alarm: 20
    min_logit_variance: 0.08
    max_disagreement_rate: 0.35
    min_predictive_entropy: 0.05
