# SafeAdapt v2 Stage C2: Hospital-1 Calibrated Controller Configuration
# Protocol: Atomic validation, bounded BN-affine displacement, slide-aware prediction-collapse monitoring
# Calibrated Partition: Camelyon17 Hospital 1 (Center 1) OOD Validation (Slides 10-19)
# Target Isolation: Hospital 2 (Center 2, Slides 20-29) strictly isolated

controller:
  # Scope & Adaptation
  bn_affine_only: true
  freeze_running_stats: true
  tta_lr: 1.0e-5

  # Numerical & Finite-value Safeguards (Stage B)
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true
  max_grad_norm: 1.0
  param_displacement_bound_linf: 0.20

  # Rollback & Fallback Policies
  max_consecutive_rejections: 5
  fallback_on_max_rejections: true
  fallback_on_unhandled_exception: true
  reset_on_boundary: false

  # Collapse Monitoring (Stage C2 Calibrated Thresholds)
  monitor:
    # Operating mode: Active enforcement after Hospital-1 validation
    mode: "active"

    # Rolling window parameters
    window_size: 50                           # Rolling window sample count N
    min_window_samples: 20                    # Minimum samples required before evaluating alarm rules
    decision_threshold: 0.5                   # Binary decision threshold for class assignment

    # Slide-aware WSI boundaries
    slide_aware_reset: true                   # Reset monitor rolling window when slide_id changes
    reset_weights_on_slide: false             # Retain adapted weights across slides (optional)

    # Calibrated Alarm Thresholds (Hospital-1 Empirical Calibration)
    # Empirical normal baseline on Hospital-1:
    #   Logit variance: mean=22.78, min=5.99, p05=7.15 (healthy spread)
    #   Binary disagreement: mean=0.002 (0.2%), p95=0.011 (1.1%), max=0.020 (2.0%)
    max_disagreement_rate: 0.35               # Source-adapted binary disagreement alarm threshold (17x normal max)
    min_logit_variance: 0.08                  # Severe logit variance collapse threshold (var < 0.08, vs healthy min 5.99)
    min_predictive_entropy: 0.05              # Near-zero entropy threshold (nats)
    consecutive_suspicious_for_rollback: 2    # Multi-signal persistence: 2 consecutive suspicious windows for REJECT_UPDATE
    consecutive_suspicious_for_fallback: 4    # Multi-signal persistence: 4 consecutive suspicious windows for FALLBACK

scientific_notice:
  status: "STAGE_C2_CALIBRATED"
  calibration_dataset: "CAMELYON17_WILDS_CENTER_1_OOD_VAL"
  calibration_wsi_count: 5                   # Calibration partition: slides 10, 12, 14, 16, 18
  assessment_wsi_count: 5                    # Assessment partition: slides 11, 13, 15, 17, 19
  target_isolation: "HOSPITAL_2_LABELS_STRICTLY_ISOLATED"
  study_design: "Exploratory / Provisional due to N_WSI = 10"
  guarantee_disclaimer: "No unconditional safety or clinical non-inferiority guarantee is claimed."
