# SafeAdapt v2 Minimal Configuration Example (Stage B)
# Protocol: Atomic validation, bounded BN-affine displacement, frozen running stats

controller:
  # Scope
  bn_affine_only: true
  freeze_running_stats: true

  # Optimization
  tta_lr: 1.0e-5

  # Finite-value validations
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true

  # Independent safeguards
  max_grad_norm: 1.0                          # Optional L2 gradient clipping threshold
  param_displacement_bound_linf: 0.20         # Candidate L_inf parameter displacement bound (epsilon)

  # Rollback & Fallback
  max_consecutive_rejections: 5
  fallback_on_max_rejections: true
  fallback_on_unhandled_exception: true
  reset_on_boundary: false

scientific_notice:
  status: "STAGE_B_DEVELOPMENT_ONLY"
  calibration_partition: "HOSPITAL_1_OOD_VAL"
  target_isolation: "HOSPITAL_2_LABELS_STRICTLY_ISOLATED"
  guarantee_disclaimer: "No unconditional safety or non-inferiority guarantee is claimed."
