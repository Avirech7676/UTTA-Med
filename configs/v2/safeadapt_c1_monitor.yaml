# SafeAdapt v2 Stage C1: Collapse-Aware Controller Configuration
# Protocol: Atomic validation, bounded BN-affine displacement, slide-aware prediction-collapse monitoring
# Note: Keep alarm thresholds disabled or in observation-only mode until calibrated on Hospital-1 development data.

controller:
  # Scope & Adaptation
  bn_affine_only: true
  freeze_running_stats: true
  tta_lr: 1.0e-5

  # Numerical & Finite-value Safeguards (Stage B)
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true
  max_grad_norm: 1.0
  param_displacement_bound_linf: 0.20

  # Rollback & Fallback
  max_consecutive_rejections: 5
  fallback_on_max_rejections: true
  fallback_on_unhandled_exception: true
  reset_on_boundary: false

  # Collapse Monitoring (Stage C1)
  monitor:
    # Operating mode: "disabled", "observation", "active"
    mode: "observation"                       # Default: observation-only mode until calibrated on Hospital-1 development data

    # Rolling window parameters
    window_size: 50                           # Rolling window sample count N
    min_window_samples: 10                    # Minimum samples required before evaluating alarm rules
    decision_threshold: 0.5                   # Binary decision threshold for class assignment

    # Slide-aware WSI boundaries
    slide_aware_reset: true                   # Reset monitor rolling window when slide_id changes
    reset_weights_on_slide: false             # Whether to also reset adapted weights to source at slide boundaries

    # Alarm thresholds (Provisional / Uncalibrated)
    max_disagreement_rate: 0.40               # Source-adapted binary disagreement alarm threshold
    min_logit_variance: 0.05                  # Severe logit variance collapse threshold (var < 0.05)
    min_predictive_entropy: 0.05              # Near-zero entropy threshold (nats)
    consecutive_suspicious_for_rollback: 2    # Consecutive suspicious windows required before REJECT_UPDATE / ROLLBACK
    consecutive_suspicious_for_fallback: 4    # Consecutive suspicious windows required before FALLBACK to source

scientific_notice:
  status: "STAGE_C1_DEVELOPMENT_ONLY"
  calibration_partition: "HOSPITAL_1_OOD_VAL_ONLY"
  target_isolation: "HOSPITAL_2_LABELS_STRICTLY_ISOLATED"
  guarantee_disclaimer: "No unconditional safety or non-inferiority guarantee is claimed. Monitoring is label-free."
