# SafeAdapt v2 Stage D1: Policy B - Deterministic Confidence Gating
policy: "confidence_only"
description: "Deterministic patch-level confidence screening (max(p, 1-p) > tau_conf)"

gating:
  tau_conf: 0.90
  strictly_greater: true

controller:
  bn_affine_only: true
  freeze_running_stats: true
  tta_lr: 1.0e-5
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true
  max_grad_norm: 1.0
  param_displacement_bound_linf: 0.20
  monitor:
    mode: "observation"
    window_size: 50
    min_samples_for_alarm: 20
    min_logit_variance: 0.08
    max_disagreement_rate: 0.35
    min_predictive_entropy: 0.05
