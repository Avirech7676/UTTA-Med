# SafeAdapt v2 Stage D1: Policy C - Faithful MC-Dropout Gating
policy: "mc_only"
description: "Faithful reproduction of v1 UTTA-Med 20-pass MC-Dropout predictive variance gating"

gating:
  n_passes: 20
  tau_unc: 8.875383e-06       # Seed 42 frozen 70th percentile of hospital-1 U
  seed: 42

controller:
  bn_affine_only: true
  freeze_running_stats: true
  tta_lr: 1.0e-5
  check_finite_loss: true
  check_finite_gradients: true
  check_finite_parameters: true
  check_finite_predictions: true
  max_grad_norm: 1.0
  param_displacement_bound_linf: 0.20
  monitor:
    mode: "observation"
    window_size: 50
    min_samples_for_alarm: 20
    min_logit_variance: 0.08
    max_disagreement_rate: 0.35
    min_predictive_entropy: 0.05
