# Stage E1 Frozen Configuration: Confidence-Gated SafeAdapt Architecture
# Strictly frozen during Stage E0. No modifications permitted during evaluation.

metadata:
  stage: STAGE_E1_PRESPECIFIED
  dataset: Camelyon17-WILDS
  hospital: Hospital 1 (Center 1) ONLY
  hospital_2_isolation: true
  frozen_date: "2026-10-11"

model:
  architecture: resnet18
  checkpoint_path: checkpoints/camelyon17_resnet18_source_s42_BEST.pt
  checkpoint_seed: 42
  checkpoint_sha256: f0b85ec1a89707a8ad1807a544280ac2302a572abd0ba84233dff6d4dd35d000
  immutable_source_copy: true

adaptation:
  scope: bn_affine_only
  train_bn_running_stats: false
  eval_dropout: true
  batch_size: 32
  loss_function: shannon_entropy
  optimizer:
    name: adam
    lr: 1.0e-05
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.0
  grad_clip_norm: 1.0

gating:
  policy: confidence_only
  tau_conf: 0.90
  calibration_provenance: hospital_1_standard_high_confidence
  zero_selected_bypass: true
  sensitivity_grid: [0.85, 0.90, 0.95, 0.9931]

controller:
  max_param_displacement_linf: 0.05
  reject_non_finite_loss: true
  reject_non_finite_grad: true
  atomic_rollback_on_rejection: true

monitor:
  mode: ACTIVE
  window_size: 10
  min_logit_variance: 0.08
  max_disagreement_rate: 0.35
  min_predictive_entropy: 0.05
  consecutive_suspicious_for_rollback: 2
  consecutive_suspicious_for_fallback: 4

execution:
  prediction_timing: pre_adaptation
  reset_policy: per_wsi_boundary
  eval_slides: [11, 13, 15, 17, 19]
  slide_order_schedules:
    order_1_natural: [11, 13, 15, 17, 19]
    order_2_reverse: [19, 17, 15, 13, 11]
    order_3_stress_tumor_ascending: [15, 19, 17, 11, 13]
